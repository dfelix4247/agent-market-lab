name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify public production x402 challenge
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATES=(
            "https://agent-market-lab.vercel.app"
            "https://agent-market-lab-wigglesthe3rds-projects.vercel.app"
            "https://agent-market-lab-git-main-wigglesthe3rds-projects.vercel.app"
          )
          PATH_SUFFIX="/api/resolve?url=https%3A%2F%2Fexample.com"

          for attempt in $(seq 1 24); do
            for base in "${CANDIDATES[@]}"; do
              rm -f /tmp/headers.txt /tmp/body.txt
              code=$(curl -sS --max-time 15 -D /tmp/headers.txt -o /tmp/body.txt -w "%{http_code}" "${base}${PATH_SUFFIX}" || true)
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/headers.txt)
              echo "Attempt $attempt $base -> HTTP $code ${location:+location=$location}"

              if [ "$code" = "402" ]; then
                payment_required=$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/headers.txt)
                if [ -n "$payment_required" ]; then
                  export PAYMENT_REQUIRED="$payment_required"
                  node -e 'const c=JSON.parse(Buffer.from(process.env.PAYMENT_REQUIRED,"base64").toString("utf8")); const t=c.accepts?.[0]; if(c.x402Version!==2 || t?.network!=="eip155:8453" || t?.payTo?.toLowerCase()!=="0x68cdcd3eded821c90b54939d2ea99a946e1c4ac5" || t?.amount!=="2000"){console.error(c); process.exit(1)} console.log("Verified public production x402 challenge", t)'
                  echo "PUBLIC_X402_ORIGIN=$base"
                  exit 0
                fi
              fi
            done
            sleep 5
          done

          echo "No public production alias returned the expected x402 challenge"
          exit 1
